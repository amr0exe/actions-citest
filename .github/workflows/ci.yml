name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you trigger it by hand too

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      app_version: ${{ steps.package_step.outputs.pkg_version }}

    defaults:
      run:
        working-directory: api # all run: steps execute inside api/
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (produce a runnable artifact)
        id: package_step
        run: | 
          npm pack # stand-in "build" step — packages the app into a tarball

          VERSION="v1.0.0.1"
          NOW=$(date + "%T")

          echo "pkg_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "timestamp=$NOW" >> "$GITHUB_OUTPUT"

      - name: Verify step transfer
        run: |
          echo "READING from preceding step"
          echo "VERSION: ${{ steps.package_step.outputs.pkg_version }}"
          echo "Built at: ${{ step.package_step.outputs.timestamp }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: verify job transfer
        run: |
          echo "RECEIVNG data from downstream job transfer"
          echo "Package version: ${{ needs.build.outputs.app_version }}"
